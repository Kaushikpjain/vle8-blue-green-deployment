---
- name: Configure VLE-8 Blue-Green Deployment Server
  hosts: vle8_servers
  become: true

  tasks:
    - name: Update Ubuntu package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install required packages and Docker
      ansible.builtin.apt:
        name:
          - docker.io
          - curl
          - ca-certificates
        state: present

    - name: Enable and start Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Add ubuntu user to Docker group
      ansible.builtin.user:
        name: ubuntu
        groups: docker
        append: true

    - name: Download K3s installation script
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /tmp/install-k3s.sh
        mode: '0755'

    - name: Install K3s server
      ansible.builtin.command: sh /tmp/install-k3s.sh
      args:
        creates: /usr/local/bin/k3s
      environment:
        INSTALL_K3S_EXEC: server

    - name: Enable and start K3s
      ansible.builtin.systemd:
        name: k3s
        enabled: true
        state: started

    - name: Wait for Kubernetes node readiness
      ansible.builtin.command:
        cmd: /usr/local/bin/k3s kubectl get nodes --no-headers
      register: k3s_nodes
      until: k3s_nodes.rc == 0 and ' Ready' in k3s_nodes.stdout
      retries: 30
      delay: 10
      changed_when: false

    - name: Display Kubernetes node
      ansible.builtin.debug:
        var: k3s_nodes.stdout
